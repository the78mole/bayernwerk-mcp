[project]
name = "bayernwerk-mcp"
version = "0.1.0"
description = "MCP server for the Bayernwerk Netz Mein.Auftragsportal (MAP) and e-fix installer portal"
authors = [
    { name = "Daniel Glaser" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=2,<2.1",
    "bayernwerk-client>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
]

[project.scripts]
bayernwerk-mcp = "bayernwerk_mcp.server:main"

[project.urls]
Homepage = "https://github.com/the78mole/bayernwerk-mcp"
Repository = "https://github.com/the78mole/bayernwerk-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayernwerk_mcp"]

# Override bayernwerk-client to use local development version - not on PyPI yet.
# Removed automatically in CI before publishing, see .github/workflows/pypi-publish.yml
[tool.uv.sources]
bayernwerk-client = { path = "/home/daniel/GIT/Python/bayernwerk-client", editable = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=bayernwerk_mcp --cov-report=term-missing"
