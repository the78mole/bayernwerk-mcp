# IMPORTANT: this filename ("pypi-publish.yml") must be exactly what's
# configured in PyPI's Trusted Publisher settings for this package - see the
# "Publishing workflows - the reusable-workflow trap" note in the
# repo-ci-standards skill for why this must NOT be split into a
# separately-`uses:`-called reusable workflow.
#
# NOTE: bayernwerk-client is not on PyPI yet as of writing this workflow.
# `uv build` only needs pyproject.toml metadata (not a working dependency
# resolution), so the build step below works regardless - but this package
# won't be *installable* from PyPI until bayernwerk-client is published
# there too. Don't enable/rely on the `publish` job before that, and before
# a PyPI Trusted Publisher is configured for this repo+workflow+environment.

name: Create Release and Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/pypi-publish.yml'
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pypi-only
          - none

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@v6.0.3
        with:
          tag_prefix: "v"
          major_pattern: "/(feat|fix|refactor)!:/"
          minor_pattern: "/^feat:/"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true

      - name: Show version
        run: |
          echo "Version: ${{ steps.semver.outputs.version }}"
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 📦 Neue Version berechnet

          **Version:** \`${{ steps.semver.outputs.version }}\`
          **Git-Tag:** \`${{ steps.semver.outputs.version_tag }}\`
          EOF

  create-release:
    name: Create GitHub Release
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.version.outputs.version_tag }} \
            --title "bayernwerk-mcp ${{ needs.version.outputs.version }}" \
            --notes "## bayernwerk-mcp ${{ needs.version.outputs.version }}

          MCP server for the Bayernwerk Netz Mein.Auftragsportal (MAP) and e-fix installer portal.

          ### Installation

          \`\`\`bash
          uvx bayernwerk-mcp==${{ needs.version.outputs.version }}
          \`\`\`
          " \
            --latest

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🏷️ GitHub Release erstellt

          **Release:** [${{ needs.version.outputs.version_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.version_tag }})
          EOF

  build:
    name: Build bayernwerk-mcp distribution
    needs: [version]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'pypi-only'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Remove local dev source override
        # Not needed for a metadata-only `build` (see note at the top of this
        # file), but keeps the shipped wheel's [project] section clean.
        run: |
          python3 - <<'EOF'
          import re, pathlib
          path = pathlib.Path("pyproject.toml")
          content = path.read_text()
          content = re.sub(
              r"\n# Override[^\n]*\n\[tool\.uv\.sources\][^\[]*",
              "\n",
              content,
              flags=re.DOTALL,
          )
          path.write_text(content)
          EOF

      - name: Set package version
        run: |
          python3 -c "
          import re, pathlib
          path = pathlib.Path('pyproject.toml')
          text = path.read_text()
          new_text, count = re.subn(r'(?m)^version = \"[^\"]*\"', 'version = \"${{ needs.version.outputs.version }}\"', text, count=1)
          assert count == 1, 'expected exactly one version = \"...\" line in [project]'
          path.write_text(new_text)
          "
          grep '^version = ' pyproject.toml

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: |
          twine check dist/*
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🔨 bayernwerk-mcp Build

          **Version:** \`${{ needs.version.outputs.version }}\`
          \`\`\`
          $(ls -lh dist/)
          \`\`\`
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bayernwerk-mcp-dist
          path: dist/

  publish:
    name: Publish bayernwerk-mcp to PyPI
    needs: [version, build]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/bayernwerk-mcp

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: bayernwerk-mcp-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Add PyPI Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 bayernwerk-mcp PyPI Veröffentlichung

          **Package:** [bayernwerk-mcp](https://pypi.org/project/bayernwerk-mcp/)
          **Version:** \`${{ needs.version.outputs.version }}\`
          EOF

  summary:
    name: Release Summary
    needs: [version, create-release, build, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Create Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🎉 Release Workflow Abgeschlossen

          **Version:** \`${{ needs.version.outputs.version }}\`
          **Git Tag:** \`${{ needs.version.outputs.version_tag }}\`

          ### Status

          - GitHub Release: ${{ needs.create-release.result == 'success' && '✅' || '❌' }}
          - PyPI Publish: ${{ needs.publish.result == 'success' && '✅' || needs.publish.result == 'skipped' && '⏭️' || '❌' }}
          EOF
