name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Check out bayernwerk-client
        # TODO: drop this + the [tool.uv.sources] override in pyproject.toml
        # once bayernwerk-client is published on PyPI - see its own repo.
        uses: actions/checkout@v7
        with:
          repository: the78mole/bayernwerk-client
          path: bayernwerk-client-src

      - name: Point local source override at the checked-out client
        run: sed -i "s#path = \"[^\"]*\"#path = \"${{ github.workspace }}/bayernwerk-client-src\"#" pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --extra dev --python ${{ matrix.python-version }} pytest --cov-report=xml

      - name: Coverage summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🧪 Test coverage (Python ${{ matrix.python-version }})
          \`\`\`
          $(uv run coverage report)
          \`\`\`
          EOF
